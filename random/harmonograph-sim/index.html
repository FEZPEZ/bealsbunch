<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Harmonograph Simulator</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #d8d3c7;
            --panel: #ebe5d9;
            --blue: #6f8ea1;
            --blue-dark: #567587;
            --line: #111;
            --shadow: 5px 5px 0px rgba(0,0,0,0.18);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; 
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            font-family: Arial, sans-serif;
            color: #111;
            display: flex;
            justify-content: center;
            /* Use dvh for mobile address bar stability */
            height: 100dvh; 
        }

        #app {
            width: 100vw;
            max-width: 500px;
            height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* PRIORITIZE BOTTOM: Settings and Previews fixed size, Drawing gets remainder */
        #drawingWrap { 
            flex: 1; /* Squish this first */
            padding: 10px; 
            min-height: 100px; 
            display: flex;
        }
        
        #drawingBox { 
            width: 100%; 
            height: 100%; 
            background: #f7f3ea; 
            border: 2px solid var(--line); 
            box-shadow: var(--shadow); 
            position: relative; 
            overflow: hidden;
        }
        
        #harmonograph { width: 100%; height: 100%; display: block; }

        .icon-box {
            position: absolute;
            top: 10px;
            width: 36px;
            height: 36px;
            background: var(--panel);
            border: 2px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        .icon-box:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        #info-box { left: 10px; }
        #settings-box { right: 10px; }

        /* FIXED HEIGHT SECTION AT BOTTOM */
        #bottom-ui {
            padding-bottom: env(safe-area-inset-bottom);
        }

        #previews { height: 120px; display: flex; gap: 10px; padding: 0 10px 10px 10px; }
        .preview { flex: 1; background: var(--panel); border: 2px solid var(--line); box-shadow: var(--shadow); }
        .preview canvas { width: 100%; height: 100%; display: block; }

        #controls { height: 260px; display: flex; gap: 10px; padding: 0 10px 10px 10px; }
        .panel { flex: 1; background: var(--panel); border: 2px solid var(--line); box-shadow: var(--shadow); padding: 8px; overflow: hidden; }
        .title { font-size: 11px; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }

        .sliderRow { margin-bottom: 7px; position: relative; }
        .slider { position: relative; height: 24px; border: 2px solid var(--line); background: #f1ece2; overflow: hidden; pointer-events: none; }
        .sliderFill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); width: 50%; }
        .sliderHandle { position: absolute; top: 0; bottom: 0; width: 12px; background: #111; transform: translateX(-50%); }
        .sliderLabel { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 7px; font-size: 10px; font-weight: bold; z-index: 3; pointer-events: none; }
        
        /* Transparent interaction layer */
        .slider-trigger {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
            touch-action: none;
        }

        .freq { display: flex; gap: 4px; margin-bottom: 7px; }
        .freqBtn, .freqValue { height: 28px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; box-shadow: 2px 2px 0px rgba(0,0,0,0.14); }
        .freqBtn { width: 28px; background: var(--blue); cursor: pointer; }
        .freqValue { flex: 1; background: #f1ece2; display: flex; gap: 5px; }
        .freqLabel { color: var(--blue-dark); font-size: 9px; text-transform: uppercase; }
        .freqValue .num { font-family: monospace; font-size: 10px; }
        .freq-locked { background: #ccc !important; color: #777; border-color: #999; box-shadow: none; }

        .overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; padding: 20px; align-items: center; justify-content: center; }
        .popup { background: var(--panel); border: 3px solid var(--line); box-shadow: 10px 10px 0px rgba(0,0,0,0.3); width: 100%; max-height: 85%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column;}
        .bottom-close { width: 100%; margin-top: 20px; color: #111; padding: 10px; background: var(--blue); border: 2px solid var(--line); font-weight: bold; cursor: pointer; }
        
        #zoom-controls { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 8px; z-index: 100; }
        .zoom-btn { width: 36px; height: 36px; background: var(--panel); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 3px 3px 0px rgba(0,0,0,0.1); font-weight: bold; }

        .toggle-row { 
            display: flex; align-items: center; justify-content: space-between; 
            background: #f1ece2; border: 2px solid var(--line); 
            padding: 8px; cursor: pointer; margin-top: 10px;
            font-size: 10px; font-weight: bold; text-transform: uppercase;
        }
        .toggle-box { width: 18px; height: 18px; border: 2px solid var(--line); background: #fff; }
        .toggle-row.active .toggle-box { background: var(--blue); position: relative; }
        .toggle-row.active .toggle-box::after { content: '✓'; color: white; position: absolute; left: 2px; top: -2px; font-size: 14px; }
    </style>
</head>
<body>

<div id="app">
    <div id="drawingWrap">
        <div id="drawingBox">
            <div id="info-box" class="icon-box"><i data-lucide="info"></i></div>
            <div id="settings-box" class="icon-box"><i data-lucide="settings"></i></div>
            <canvas id="harmonograph"></canvas>
            <div id="zoom-controls">
                <div class="zoom-btn" id="zoom-out">−</div>
                <div class="zoom-btn" id="zoom-in">+</div>
            </div>
        </div>
    </div>

    <div id="bottom-ui">
        <div id="previews">
            <div class="preview"><canvas id="preview1"></canvas></div>
            <div class="preview"><canvas id="preview2"></canvas></div>
        </div>

        <div id="controls">
            <div class="panel" id="panel1"></div>
            <div class="panel" id="panel2"></div>
        </div>
    </div>

    <div id="info-overlay" class="overlay">
        <div class="popup">
            <h2>Pendulum Physics</h2>
            <p><strong>Frequency & Phase:</strong> This simulator combines two independent pendulums into a single drawing point.</p>
            <button class="bottom-close" onclick="closeOverlay('info-overlay')">CLOSE</button>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="popup">
            <h2>Global Settings</h2>
            <div id="global-sliders"></div>
            <button class="bottom-close" onclick="closeOverlay('settings-overlay')">CLOSE</button>
        </div>
    </div>
</div>

<script>
const CONFIG = {
    RES_MULTIPLIER: 1.5, // High resolution variable
    MAIN_LINE_WIDTH: 3.0,   // Main thickness
    ZOOM: 6.0, MIN_ZOOM: 1, MAX_ZOOM: 20.0, ZOOM_STEP: 1,
    
    SIM_RES_MULTIPLIER: 1.5, // Sim resolution
    SIM_LINE_WIDTH: 5.0,     // Sim thickness
    SIM_ZOOM: 1.8,
    DECAY: 0.0001,
    DECAY_VALUES: [0.00005, 0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01],
    TIME_STEP: 0.015, MAX_STEPS: 40000, MIN_AMP: 0.002, DRAW_SCALE: 0.5, SIM_SCALE: 0.3,
    MIN_FREQ: 1, MAX_FREQ: 10.0, FREQ_STEP: 0.002, REPEAT_DELAY: 300, REPEAT_RATE: 40,
    FREQ_DECIMALS: 3,
    REVERSE_P2: false,
    LIMITS: {
        xmag: { min: 0, max: 220 },
        ymag: { min: 0, max: 220 },
        rotation: { min: -180, max: 180 },
        phase: { min: 0, max: 360 }
    }
};

const state = {
    p1: { xmag: 60, ymag: 130, rotation: -70, phase: 0, freq: 1.00 },
    p2: { xmag: 150, ymag: 160, rotation: -40, phase: 90, freq: 1.01 }
};

const hctx = document.getElementById("harmonograph").getContext("2d");
const pctx1 = document.getElementById("preview1").getContext("2d");
const pctx2 = document.getElementById("preview2").getContext("2d");

lucide.createIcons();
document.getElementById('info-box').onclick = () => document.getElementById('info-overlay').style.display = 'flex';
document.getElementById('settings-box').onclick = () => document.getElementById('settings-overlay').style.display = 'flex';
function closeOverlay(id) { document.getElementById(id).style.display = 'none'; }

// BETTER SLIDER: Tracks window-level movement
function makeSlider(panel, obj, key, label) {
    const cfg = CONFIG.LIMITS[key];
    const row = document.createElement("div");
    row.className = "sliderRow";
    row.innerHTML = `
        <div class="slider">
            <div class="sliderFill"></div>
            <div class="sliderHandle"></div>
            <div class="sliderLabel">${label}</div>
        </div>
        <div class="slider-trigger"></div>`;
    
    const trigger = row.querySelector('.slider-trigger');
    const fill = row.querySelector('.sliderFill');
    const handle = row.querySelector('.sliderHandle');

    const updateFromEvent = (e) => {
        const rect = trigger.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let pct = (clientX - rect.left) / rect.width;
        pct = Math.max(0, Math.min(1, pct));
        
        const val = cfg.min + pct * (cfg.max - cfg.min);
        obj[key] = val;
        
        fill.style.width = (pct * 100) + "%";
        handle.style.left = (pct * 100) + "%";
        redrawAll();
    };

    let isDragging = false;
    const start = (e) => { isDragging = true; updateFromEvent(e); };
    const move = (e) => { if(isDragging) { e.preventDefault(); updateFromEvent(e); } };
    const stop = () => { isDragging = false; };

    trigger.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);
    trigger.addEventListener('touchstart', start);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', stop);

    // Initial positioning
    const initialPct = (obj[key] - cfg.min) / (cfg.max - cfg.min);
    fill.style.width = (initialPct * 100) + "%";
    handle.style.left = (initialPct * 100) + "%";

    panel.appendChild(row);
}

function makeFreq(panel, obj, title, isLocked = false) {
    const row = document.createElement("div");
    if(isLocked) {
        row.innerHTML = `<div class="title">${title}</div><div class="freq">
            <div class="freqValue freq-locked"><span class="freqLabel">freq:</span><span class="num">${obj.freq.toFixed(CONFIG.FREQ_DECIMALS)}</span></div>
        </div>`;
    } else {
        row.innerHTML = `<div class="title">${title}</div><div class="freq">
            <div class="freqBtn" id="m">−</div><div class="freqValue"><span class="freqLabel">freq:</span><span class="num"></span></div><div class="freqBtn" id="p">+</div>
        </div>`;
        const num = row.querySelector('.num');
        const update = () => { num.textContent = obj.freq.toFixed(CONFIG.FREQ_DECIMALS); redrawAll(); };
        const setupHold = (btn, delta) => {
            let timer, repeat;
            const start = (e) => {
                obj.freq = Math.min(CONFIG.MAX_FREQ, Math.max(CONFIG.MIN_FREQ, obj.freq + delta));
                update();
                timer = setTimeout(() => { repeat = setInterval(() => {
                    obj.freq = Math.min(CONFIG.MAX_FREQ, Math.max(CONFIG.MIN_FREQ, obj.freq + delta));
                    update();
                }, CONFIG.REPEAT_RATE); }, CONFIG.REPEAT_DELAY);
            };
            const end = () => { clearTimeout(timer); clearInterval(repeat); };
            btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); });
            btn.addEventListener('mouseup', end); btn.addEventListener('mouseleave', end); btn.addEventListener('touchend', end);
        };
        setupHold(row.querySelector('#m'), -CONFIG.FREQ_STEP);
        setupHold(row.querySelector('#p'), CONFIG.FREQ_STEP);
        update();
    }
    panel.appendChild(row);
}

function makeSteppedControl(panel, label) {
    const row = document.createElement("div");
    row.style.width = "60%";
    row.style.margin = "0 auto";
    row.innerHTML = `<div class="title" style="text-align:center">${label}</div><div class="freq">
        <div class="freqBtn" id="m">−</div>
        <div class="freqValue"><span class="freqLabel">RATE:</span><span class="num"></span></div>
        <div class="freqBtn" id="p">+</div>
    </div>`;
    const num = row.querySelector('.num');
    const update = () => { num.textContent = Math.round(CONFIG.DECAY * 100000); redrawAll(); };
    row.querySelector('#m').onclick = () => {
        let idx = CONFIG.DECAY_VALUES.indexOf(CONFIG.DECAY);
        CONFIG.DECAY = CONFIG.DECAY_VALUES[Math.max(0, idx - 1)];
        update();
    };
    row.querySelector('#p').onclick = () => {
        let idx = CONFIG.DECAY_VALUES.indexOf(CONFIG.DECAY);
        CONFIG.DECAY = CONFIG.DECAY_VALUES[Math.min(CONFIG.DECAY_VALUES.length - 1, idx + 1)];
        update();
    };
    update();
    panel.appendChild(row);
}

function buildUI() {
    [document.getElementById("panel1"), document.getElementById("panel2")].forEach((p, i) => {
        const target = i === 0 ? state.p1 : state.p2;
        makeFreq(p, target, `PENDULUM ${i + 1}`, i === 0);
        makeSlider(p, target, "xmag", "X MAG");
        makeSlider(p, target, "ymag", "Y MAG");
        makeSlider(p, target, "rotation", "ROTATION");
        makeSlider(p, target, "phase", "PHASE");
        if (i === 1) {
            const toggle = document.createElement('div');
            toggle.className = "toggle-row";
            toggle.innerHTML = `<span>Reverse Spin</span><div class="toggle-box"></div>`;
            toggle.onclick = () => { CONFIG.REVERSE_P2 = !CONFIG.REVERSE_P2; toggle.classList.toggle('active', CONFIG.REVERSE_P2); redrawAll(); };
            p.appendChild(toggle);
        }
    });
    makeSteppedControl(document.getElementById("global-sliders"), "GLOBAL DECAY");
}

function rad(d) { return d * Math.PI / 180; }
function rotate(x, y, a) { return { x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) }; }

function getPos(p, t, amp, mode, isP2 = false) {
    const s = mode === 'draw' ? CONFIG.DRAW_SCALE : CONFIG.SIM_SCALE;
    const f = (isP2 && CONFIG.REVERSE_P2) ? -p.freq : p.freq;
    const x = Math.cos(t * f + rad(p.phase)) * p.xmag * amp * s;
    const y = Math.sin(t * f + rad(p.phase)) * p.ymag * amp * s;
    return rotate(x, y, rad(p.rotation));
}

function redrawAll() {
    const canvas = hctx.canvas;
    hctx.clearRect(0, 0, canvas.width, canvas.height);
    hctx.save();
    hctx.translate(canvas.width/2, canvas.height/2);
    const finalScale = CONFIG.ZOOM * CONFIG.RES_MULTIPLIER;
    hctx.scale(finalScale, finalScale);
    
    hctx.strokeStyle = "#111"; 
    hctx.lineWidth = CONFIG.MAIN_LINE_WIDTH / finalScale; // Thickness normalization
    
    hctx.beginPath();
    let amp = 1;
    for(let i=0; i<CONFIG.MAX_STEPS; i++){
        const t = i * CONFIG.TIME_STEP;
        const p1 = getPos(state.p1, t, amp, 'draw', false);
        const p2 = getPos(state.p2, t, amp, 'draw', true);
        if(i === 0) hctx.moveTo(p1.x + p2.x, p1.y + p2.y);
        else hctx.lineTo(p1.x + p2.x, p1.y + p2.y);
        amp *= (1 - CONFIG.DECAY * amp);
        if(amp < CONFIG.MIN_AMP) break;
    }
    hctx.stroke(); 
    hctx.restore();
}

// Update to drawPreview() for the sim lines:
function drawPreview(ctx, p, time, isP2) {
    const c = ctx.canvas;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.save(); 
    ctx.translate(c.width/2, c.height/2);
    
    const simScale = CONFIG.SIM_ZOOM * CONFIG.SIM_RES_MULTIPLIER;
    ctx.scale(simScale, simScale);
    
    ctx.strokeStyle = "#111"; 
    ctx.lineWidth = CONFIG.SIM_LINE_WIDTH / simScale; // Independent thickness
    
    ctx.beginPath();
    for(let i=0; i<=100; i++){
        const phase = (i/100) * Math.PI * 2;
        const x_raw = Math.cos(phase + rad(p.phase)) * p.xmag * CONFIG.SIM_SCALE;
        const y_raw = Math.sin(phase + rad(p.phase)) * p.ymag * CONFIG.SIM_SCALE;
        const r = rotate(x_raw, y_raw, rad(p.rotation));
        if(i===0) ctx.moveTo(r.x, r.y); else ctx.lineTo(r.x, r.y);
    }
    ctx.stroke();
    
    const pos = getPos(p, time, 1, 'sim', isP2);
    ctx.fillStyle = "#567587"; 
    const b = (4 / simScale)*4.5; // Normalize bob size
    ctx.fillRect(pos.x-b, pos.y-b, b*2, b*2);
    ctx.restore();
}

function resize() {
    [hctx, pctx1, pctx2].forEach(c => { 
        const dpr = window.devicePixelRatio || 1;
        const rect = c.canvas.getBoundingClientRect();
        // Multiply by internal resolution config
        c.canvas.width = rect.width * dpr * CONFIG.RES_MULTIPLIER;
        c.canvas.height = rect.height * dpr * CONFIG.RES_MULTIPLIER;
    });
    redrawAll();
}

document.getElementById('zoom-in').onclick = () => { CONFIG.ZOOM += CONFIG.ZOOM_STEP; redrawAll(); };
document.getElementById('zoom-out').onclick = () => { CONFIG.ZOOM = Math.max(CONFIG.MIN_ZOOM, CONFIG.ZOOM - CONFIG.ZOOM_STEP); redrawAll(); };

window.onresize = resize;
buildUI();

let time = 0;
function loop() {
    time += 0.03;
    drawPreview(pctx1, state.p1, time, false);
    drawPreview(pctx2, state.p2, time, true);
    requestAnimationFrame(loop);
}
resize(); loop();
</script>
</body>
</html>
